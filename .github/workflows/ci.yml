
name: Vienna Cuts CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    name: TypeScript, Lint, Tests and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vienna_test
          POSTGRES_PASSWORD: vienna_test_password
          POSTGRES_DB: vienna_cuts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vienna_test -d vienna_cuts_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vienna_test:vienna_test_password@localhost:5432/vienna_cuts_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate

      - name: Seed test database
        run: npm run prisma:seed

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Run database integration tests
        run: npm run test:integration

      - name: Build application
        env:
          BETTER_AUTH_URL: http://localhost:3000
        run: |
          export BETTER_AUTH_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("base64url"))')"
          npm run build
